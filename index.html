<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="wrap">
    <h1 class="title">Sudoku</h1>
    <p class="subtitle">remplissez la grille</p>
        <div class="diff">
         <label>difficulté</label>
            <select id="diff">
            <option value="35">facile</option>
            <option value="45" selected>moyen</option>
            <option value="55">difficile</option>
      </select>
    </div>
    <div class="board" id="board"></div>
        <div class="status" id="status"></div>
         <div class="actions">
            <button class="btn generate" onclick="generate()">⟳ Nouvelle grille</button>
            <button class="btn"          onclick="clr()">Effacer</button>
            <button class="btn"          onclick="chk()">Vérifier</button>
             <button class="btn primary"  onclick="sol()">Solution</button>
        </div>
    </div>
</body>
</html>
